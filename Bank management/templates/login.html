<!DOCTYPE html>
<html>

<head>

    <title>Bank Management - Login</title>

    <link rel="stylesheet"
          href="/static/style.css">

</head>

<body>

<div class="login-container">

    <h1>BANK MANAGEMENT SYSTEM</h1>

    <h2>Login</h2>


    <!-- ADMIN / USER CHOICE -->

    <div class="login-choice">

        <label>

            <input
                type="radio"
                name="login_type_choice"
                value="admin"
                onclick="showLogin('admin')"
                checked
            >

            Admin

        </label>


        <label>

            <input
                type="radio"
                name="login_type_choice"
                value="user"
                onclick="showLogin('user')"
            >

            User

        </label>

    </div>


    <!-- ERROR MESSAGE -->

    {% if error %}

        <p class="error">
            {{ error }}
        </p>

    {% endif %}


    <!-- ADMIN LOGIN -->

    <div id="admin-login">

        <form action="/login"
              method="post">

            <input
                type="hidden"
                name="login_type"
                value="admin"
            >

            <input
                type="text"
                name="username"
                placeholder="Admin Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Admin Password"
                required
            >

            <button type="submit">
                Admin Login
            </button>

        </form>

    </div>


    <!-- USER LOGIN -->

    <div id="user-login"
         style="display:none;">

        <form action="/login"
              method="post">

            <input
                type="hidden"
                name="login_type"
                value="user"
            >

            <input
                type="text"
                name="username"
                placeholder="User Name"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                User Login
            </button>

        </form>

    </div>

</div>


<script>

function showLogin(type) {

    const adminLogin =
        document.getElementById("admin-login");

    const userLogin =
        document.getElementById("user-login");


    if (type === "admin") {

        adminLogin.style.display = "block";

        userLogin.style.display = "none";

    }

    else {

        adminLogin.style.display = "none";

        userLogin.style.display = "block";

    }

}

</script>

</body>

</html>
